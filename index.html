/* Layout: lab-bench datasheet. A scope trace in the hero, a topic selector on the left like a channel strip, project cards on the right grouped by topic. */
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1512; --surface: #151E19; --ink: #DCE7DF; --muted: #92A198; --rule: #27342D;
  --accent: #5CCB9F; --copper: #E39A5E;
  --st-active: #5CCB9F; --st-maint: #7DB4D8; --st-exp: #E39A5E; --st-dormant: #8E9A92;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 76rem;
  margin-inline: auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Hero */
.hero { border-bottom: 1px solid var(--rule); }
.hero-text { display: flex; flex-direction: column; gap: 14px; padding-block: 40px 20px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 0; font: 700 clamp(1.4rem, 3vw, 1.85rem)/1.1 var(--font-display);
  letter-spacing: -.035em; text-wrap: balance;
}
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.lede { margin: 0; max-width: 100%; font-size: 1.1rem; color: var(--muted); text-wrap: pretty; }
.lede b { color: var(--ink); font-weight: 600; }

/* Layout */
.main { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); gap: 36px; padding-block: 28px 64px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 4px; }
.rail-title { font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 10px 10px; }
.topic {

  padding: 7px 10px; font: 500 14px/1.25 var(--font-body);
}
.topic .n { font: 400 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.topic svg.i { color: var(--muted); }
.topic:hover { background: var(--surface); }
.topic[aria-pressed="true"] { background: var(--surface); border-color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-bottom: 14px; }

.field {

.tag { border: 1px solid var(--rule); border-radius: 3px; padding: 3px 5px; }
.count { margin-left: auto; font: 400 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.group + .group { margin-top: 40px; }
.group-head { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
.group-head svg.i { width: 26px; height: 26px; color: var(--accent); grid-row: span 2; }

.group-head .n { font: 400 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.group-head p { margin: 0; grid-column: 2 / 4; color: var(--muted); font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); gap: 12px; }
.card {

.card:hover { border-color: var(--accent); }
.card-top { display: flex; gap: 12px; align-items: center; }
.ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); flex: none; }

.name { font: 700 1.05rem/1.2 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.card .desc { margin: 0; font-size: 14px; color: var(--muted); text-wrap: pretty; }
.card .desc.none { font-style: italic; opacity: .8; }
.meta { margin-top: auto; padding-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font: 400 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill {

  font: 500 11px/1 var(--font-mono); letter-spacing: .04em; color: var(--st);
  background: color-mix(in srgb, var(--st) 13%, transparent);

.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--st); }

.star { color: var(--copper); }
.empty { padding: 40px 0; color: var(--muted); }
.foot { padding-block: 0 40px; font: 400 12px/1.5 var(--font-mono); color: var(--muted); border-top: 1px solid var(--rule); padding-top: 18px; }

@media (max-width: 860px) {

  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; scrollbar-width: thin; }
  .rail-title { display: none; }
  .topic { width: auto; flex: none; grid-template-columns: 1.4em auto auto; border-color: var(--rule); white-space: nowrap; }
  .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    <div class="card-top"><span class="ico" title="${esc(t.label)}">${icon(r.main)}</span>
      <span class="name">${esc(r.n)}</span></div>
    <p class="desc${r.d ? '' : ' none'}">${esc(r.d || 'No description yet.')}</p>
    <div class="meta"><span class="pill st-${r.st}" title="${esc(STATUS_HINT[r.st])}">${STATUS_LABEL[r.st]}</span>
      ${r.l ? `<span>${esc(r.l)}</span>` : ''}${r.f ? '<span class="tag">Fork</span>' : ''}${r.plats.slice(0, 3).map(k => `<span class="tag">${esc(PLATFORMS.find(p => p.k === k).label.split(' ')[0])}</span>`).join('')}<span class="star">★ ${r.s}</span><span>${month(r.p)}</span></div>
  </a>`;
}

function renderPlatforms() {
  const items = [{ k: 'any', label: 'Any', ic: 'all', n: REPOS.length }, ...PLATFORMS.map(p => ({ ...p, n: REPOS.filter(r => r.plats.includes(p.k)).length })).filter(p => p.n).sort((x, y) => y.n - x.n)];
  $('platforms').innerHTML = '<span class="lbl">Platform</span>' + items.map(p =>
    `<button class="chip" type="button" data-p="${p.k}" aria-pressed="${state.platform === p.k}">${icon(p.ic)}<span>${esc(p.label)}</span><span class="n">${p.n}</span></button>`).join('');
}
let topicOrder = [];
function renderTopics() {
  const counts = Object.fromEntries(TOPICS.map(t => [t.k, REPOS.filter(r => r.keys.includes(t.k)).length]));
  const items = [{ k: 'all', label: 'All projects', n: REPOS.length }, ...TOPICS.filter(t => counts[t.k]).map(t => ({ k: t.k, label: t.label, n: counts[t.k] })).sort((x, y) => y.n - x.n)];
  topicOrder = items.map(t => t.k);
  $('topics').innerHTML = items.map(t =>
    `<button class="topic" type="button" data-k="${t.k}" aria-pressed="${state.topic === t.k}">${icon(t.k)}<span>${esc(t.label)}</span><span class="n">${t.n}</span></button>`).join('');
}

function render() {
  syncUrl();
  const base = REPOS.filter(matches);
  let html = '', shown = 0;
  if (state.topic === 'all') {
    const groups = TOPICS.map(t => ({ t, list: sorted(base.filter(r => r.main === t.k)) })).filter(g => g.list.length).sort((x, y) => topicOrder.indexOf(x.t.k) - topicOrder.indexOf(y.t.k));
    for (const { t, list } of groups) { shown += list.length; html += groupHtml(t, list); }
  } else {
    const t = TOPIC_BY_KEY[state.topic];
    const list = sorted(base.filter(r => r.keys.includes(t.k)));
    shown = list.length;
    if (list.length) html = groupHtml(t, list);
  }
  $('results').innerHTML = html || '<p class="empty">No projects match. Clear the search or choose another status.</p>';
  $('count').textContent = `${shown} of ${REPOS.length} projects`;
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === state.platform)));
  document.querySelectorAll('.topic').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === state.topic)));
}
function syncUrl() {
  try {
    const u = new URL(location.href);
    state.topic === 'all' ? u.searchParams.delete('topic') : u.searchParams.set('topic', state.topic);
    state.platform === 'any' ? u.searchParams.delete('platform') : u.searchParams.set('platform', state.platform);
    history.replaceState(null, '', u);
  } catch (e) { /* sandboxed frame */ }
}
function groupHtml(t, list) {
  return `<section class="group" aria-labelledby="g-${t.k}"><div class="group-head">${icon(t.k)}<h2 id="g-${t.k}">${esc(t.label)}</h2><span class="n">${list.length}</span><p>${esc(t.blurb)}</p></div><div class="grid">${list.map(card).join('')}</div></section>`;
}
function heroStats() {
  const stars = REPOS.reduce((a, r) => a + r.s, 0);
  $('hero-stats').textContent = `${REPOS.length} public projects, ${fmt(stars)} stars, ${fmt(followers)} followers.`;
}

$('topics').addEventListener('click', e => {
  const b = e.target.closest('.topic'); if (!b) return;
  state.topic = b.dataset.k; render();
});
$('platforms').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.platform = b.dataset.p; render();
});
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('status').addEventListener('change', e => { state.status = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });

function boot(sourceNote) {
  prepare(); heroStats(); renderPlatforms(); renderTopics(); render();
  $('foot').textContent = sourceNote;
}
boot(`Snapshot from ${SNAPSHOT_DATE}. Only the forks you chose to show are listed. Topics are grouped by name, description and GitHub topics.`);

// Replace the snapshot with live data when GitHub's API is reachable.
(async () => {
  try {
    const all = [];
    for (let p = 1; p <= 3; p++) {
      const res = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&page=${p}&sort=pushed`);
      if (!res.ok) throw new Error(res.status);
      const page = await res.json(); all.push(...page);
      if (page.length < 100) break;
    }
    const u = await fetch(`https://api.github.com/users/${USER}`).then(r => r.ok ? r.json() : null).catch(() => null);
    if (u) followers = u.followers;
    REPOS = all.filter(r => !r.fork || INCLUDE_FORKS.includes(r.name)).map(r => ({ n: r.name, d: r.description, t: r.topics || [], a: r.archived, p: r.pushed_at, s: r.stargazers_count, l: r.language, f: r.fork }));
    boot(`Live from the GitHub API. Only the forks you chose to show are listed. Topics are grouped by name, description and GitHub topics.`);
  } catch (e) { /* keep the snapshot */ }
})();

</script>
</body>
</html>
